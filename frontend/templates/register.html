{% extends "base.html" %}
{% block title %}Stock Daddy – Register{% endblock %}

{% block body %}
<div class="login-wrapper">
    <div class="login-card">
        <h1 class="login-logo">Stock Daddy</h1>
        <p class="login-subtitle">Create an owner account</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="first_name">First name</label>
                <input type="text" id="first_name" name="first_name" placeholder="First name" required autofocus />
            </div>
            <div class="form-group">
                <label for="last_name">Last name</label>
                <input type="text" id="last_name" name="last_name" placeholder="Last name" required />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter email" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" />
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="8" />
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </form>

        <p class="login-hint">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
