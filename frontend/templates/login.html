{% extends "base.html" %}
{% block title %}Stock Daddy – Login{% endblock %}

{% block body %}
<div class="login-wrapper">
    <div class="login-card">
        <h1 class="login-logo">Stock Daddy</h1>
        <p class="login-subtitle">Multi-Site Inventory Management</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter email" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-full">Log In</button>
        </form>

        <p class="login-hint">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </div>
</div>
{% endblock %}
